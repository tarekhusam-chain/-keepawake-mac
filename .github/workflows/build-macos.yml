name: Build KeepAwake for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: AppleSilicon
            runner: macos-15
            architecture: arm64
          - label: Intel
            runner: macos-15-intel
            architecture: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyautogui pyinstaller

      - name: Build Mac application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name KeepAwakeMac \
            --osx-bundle-identifier com.keepawake.macos \
            KeepAwakeMac.py

      - name: Package application
        run: |
          /usr/bin/ditto -c -k --keepParent \
            dist/KeepAwakeMac.app \
            KeepAwakeMac-${{ matrix.label }}.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwakeMac-${{ matrix.label }}
          path: KeepAwakeMac-${{ matrix.label }}.zip
          if-no-files-found: error
